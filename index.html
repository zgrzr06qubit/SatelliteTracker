<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Tracker Embed</title>
    <style>
        /* This removes all browser margins so the map fills the entire Framer block perfectly */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        satellite-tracker {
            width: 100% !important;
            height: 100vh !important;
            display: block;
        }
    </style>
</head>
<body>

    <script type="module" src="./satellite-tracker.js"></script>

    <satellite-tracker satellite="58467"></satellite-tracker>

</body>
</html>
